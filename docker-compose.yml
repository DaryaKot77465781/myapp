services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: career
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/career
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      API_KEY: dev-api-key
    depends_on:
      - postgres
      - redis
      - qdrant
    ports:
      - "8000:8000"
    command: bash -c "alembic upgrade head && python scripts/load_seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/career
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      API_KEY: dev-api-key
    depends_on:
      - postgres
      - redis
      - qdrant
    command: bash -c "alembic upgrade head && python scripts/load_seed.py && rq worker career-jobs"

volumes:
  pg_data:
  qdrant_data:
