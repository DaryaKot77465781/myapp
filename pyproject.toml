[project]
name = "career-growth-mvp"
version = "0.1.0"
description = "AI backend for personalized career growth plans"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.19",
  "alembic>=1.13.1",
  "redis>=5.0.4",
  "rq>=1.16.2",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  "pypdf>=4.2.0",
  "qdrant-client>=1.9.1",
  "httpx>=0.27.0",
  "PyYAML>=6.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["seed*", "alembic*", "tests*"]
